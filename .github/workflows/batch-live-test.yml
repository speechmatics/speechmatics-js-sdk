# Runs the batch client against the real Speechmatics API.
# This submits real jobs, so it only runs when explicitly requested:
#   - Manually from the Actions tab (workflow_dispatch). Note this requires the workflow to be on the default branch.
#   - By adding the `live-test` label to a PR. Remove and re-add the label to run it again.
name: Batch client live API test
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: batch-live-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-test:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'live-test'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run live tests
        run: pnpm --filter @speechmatics/batch-client test:live
        env:
          SPEECHMATICS_API_KEY: ${{ secrets.API_KEY }}
